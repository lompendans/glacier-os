<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Glacier OS Trailer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--accent:#5ac8fa;--tint:.16;--blur:24px;--mono:"JetBrains Mono",ui-monospace,Consolas,monospace}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#000;overflow:hidden}
body{font-family:Inter,system-ui,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
#stage{position:absolute;left:50%;top:50%;width:1920px;height:1080px;transform-origin:50% 50%;overflow:hidden;color:#fff;background:#070b18;font-size:15px}
.abs{position:absolute;will-change:transform,opacity}

/* wallpaper */
#wall{position:absolute;inset:0;background:radial-gradient(120% 100% at 20% 0%,#1a2550 0%,#070b18 70%)}
.blob{position:absolute;border-radius:50%;filter:blur(70px);opacity:.85}
#ribbons{position:absolute;inset:0;width:100%;height:100%;opacity:.55}
#vignette{position:absolute;inset:0;background:radial-gradient(120% 90% at 50% 50%,transparent 55%,rgba(0,0,0,.55));pointer-events:none}

/* liquid glass */
.glass{position:absolute;isolation:isolate;
  background:linear-gradient(150deg,rgba(255,255,255,calc(var(--tint)*1.25)),rgba(255,255,255,calc(var(--tint)*.45)));
  -webkit-backdrop-filter:blur(var(--blur)) saturate(185%) brightness(1.05);backdrop-filter:blur(var(--blur)) saturate(185%) brightness(1.05);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.55),inset 0 -1px 0 rgba(255,255,255,.1),inset 0 0 22px rgba(255,255,255,.06),0 18px 50px rgba(0,0,0,.32),0 2px 8px rgba(0,0,0,.14)}
.glass::before{content:"";position:absolute;inset:0;border-radius:inherit;z-index:-1;pointer-events:none;
  background:radial-gradient(120% 60% at 15% 0%,rgba(255,255,255,.22),transparent 55%),radial-gradient(80% 50% at 100% 100%,rgba(255,255,255,.08),transparent 60%)}
.glass::after{content:"";position:absolute;inset:0;border-radius:inherit;padding:1.2px;pointer-events:none;z-index:2;
  background:linear-gradient(135deg,rgba(255,255,255,.9),rgba(255,255,255,.08) 35%,rgba(255,255,255,.04) 65%,rgba(255,255,255,.55));
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude}
.strong{background:linear-gradient(160deg,rgba(255,255,255,.15),rgba(255,255,255,.05)),rgba(14,18,36,.5)}
.lens{-webkit-backdrop-filter:blur(8px) url(#lg) saturate(190%) brightness(1.08);backdrop-filter:blur(8px) url(#lg) saturate(190%) brightness(1.08)}

/* icons */
.app-icon{width:100%;height:100%;border-radius:28%;display:grid;place-items:center;color:#fff;position:relative;overflow:hidden;
  box-shadow:inset 0 1px 1px rgba(255,255,255,.7),inset 0 -3px 8px rgba(0,0,0,.18),0 8px 18px rgba(0,0,0,.28)}
.app-icon::before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,255,255,.5),rgba(255,255,255,0) 55%);opacity:.55}
.app-icon::after{content:"";position:absolute;inset:0;border-radius:inherit;box-shadow:inset 0 0 0 1px rgba(255,255,255,.28)}
.app-icon svg{width:54%;height:54%;position:relative;filter:drop-shadow(0 1px 2px rgba(0,0,0,.3))}

/* logo + type */
#logo{left:870px;top:330px;width:180px;height:180px;border-radius:52px;display:grid;place-items:center}
#logo svg{width:96px;height:96px;overflow:visible}
#logo path{stroke:#fff;stroke-width:1.5;fill:none;stroke-linecap:round;stroke-linejoin:round}
#title{left:0;width:1920px;top:548px;text-align:center;font-size:96px;font-weight:800;letter-spacing:-3px}
#title span{display:inline-block}
#tagline{left:0;width:1920px;top:672px;text-align:center;font-size:30px;font-weight:500;color:rgba(255,255,255,.78)}
.cap{left:120px;width:560px}
.cap .eb{font-size:16px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:var(--accent);margin-bottom:16px}
.cap .big{font-size:60px;font-weight:800;letter-spacing:-2px;line-height:1.05}
.cap .sm{font-size:21px;color:rgba(255,255,255,.72);margin-top:18px;line-height:1.45;font-weight:500}
.center-cap{left:0;width:1920px;text-align:center}
.center-cap .big{font-size:74px;font-weight:800;letter-spacing:-2.5px}
.center-cap .sm{font-size:24px;color:rgba(255,255,255,.75);margin-top:14px;font-weight:500}

/* lens scene */
#lens{left:0;top:0;width:640px;height:400px;border-radius:64px}
#pill{left:0;top:0;width:300px;height:110px;border-radius:55px}

/* top bar */
#topbar{left:16px;top:14px;width:1888px;height:46px;border-radius:16px;display:flex;align-items:center;padding:0 8px;gap:4px;font-weight:500}
.tb{height:32px;padding:0 12px;border-radius:10px;display:flex;align-items:center;gap:8px;white-space:nowrap}
.tb.on{background:rgba(255,255,255,.16)}
.tb.app{font-weight:700}
.tb.menu{color:rgba(255,255,255,.72)}
.lg{width:22px;height:22px;border-radius:7px;display:grid;place-items:center;background:linear-gradient(135deg,var(--accent),#8a7dff);box-shadow:inset 0 1px 0 rgba(255,255,255,.6)}
#tb-clock{position:absolute;left:50%;transform:translateX(-50%);font-weight:600}
.tb-right{margin-left:auto;display:flex;gap:2px}

/* dock */
#dock{left:0;bottom:22px;height:92px;border-radius:32px;padding:0 14px}
#dockrow{position:absolute;left:14px;bottom:18px;display:flex;align-items:flex-end;gap:10px}
.di{position:relative;width:64px;height:64px;flex-shrink:0}
.di .dot{position:absolute;bottom:-11px;left:50%;width:6px;height:6px;margin-left:-3px;border-radius:50%;background:#fff;opacity:0}
.dsep{width:1px;height:52px;margin:0 4px 6px;background:linear-gradient(transparent,rgba(255,255,255,.45),transparent)}

/* windows */
.win{border-radius:26px;overflow:hidden;display:flex;flex-direction:column}
.titlebar{height:52px;display:flex;align-items:center;gap:12px;padding:0 14px 0 18px;flex-shrink:0;font-weight:600}
.titlebar .ti{width:24px;height:24px}
.titlebar .t{flex:1}
.ctrls{display:flex;gap:8px}
.ctrl{width:26px;height:26px;border-radius:50%;background:rgba(255,255,255,.14);display:grid;place-items:center;color:rgba(255,255,255,.75)}
.wb{flex:1;display:flex;min-height:0}
.side{width:200px;padding:4px 12px;border-right:1px solid rgba(255,255,255,.12);display:flex;flex-direction:column;gap:3px}
.side .h{font-size:12px;font-weight:700;color:rgba(255,255,255,.5);text-transform:uppercase;letter-spacing:.07em;padding:8px 12px 4px}
.side .it{padding:9px 12px;border-radius:11px;color:rgba(255,255,255,.74);font-weight:500;display:flex}
.side .it.on{background:rgba(255,255,255,.14);color:#fff;font-weight:600;box-shadow:inset 0 1px 0 rgba(255,255,255,.2)}
.side .badge{margin-left:auto;font-size:12px;padding:1px 8px;border-radius:9px;background:var(--accent);font-weight:700}
.st-main{flex:1;padding:6px 22px 22px;display:flex;flex-direction:column;gap:16px;min-width:0}
.field{display:flex;align-items:center;gap:10px;height:40px;padding:0 14px;border-radius:13px;background:rgba(0,0,0,.18);box-shadow:inset 0 1px 2px rgba(0,0,0,.15);color:rgba(255,255,255,.5)}
.hero{border-radius:22px;padding:26px;display:flex;align-items:center;gap:26px;position:relative;overflow:hidden;
  background:linear-gradient(120deg,rgba(255,106,213,.55),rgba(138,92,255,.55) 55%,rgba(90,200,250,.4));box-shadow:inset 0 1px 0 rgba(255,255,255,.4)}
.hero::after{content:"";position:absolute;right:-60px;top:-90px;width:320px;height:320px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.35),transparent 65%)}
.pk{width:54px;height:54px;border-radius:16px;display:grid;place-items:center;font-weight:800;font-size:24px;color:#fff;flex-shrink:0;position:relative;overflow:hidden;box-shadow:inset 0 1px 1px rgba(255,255,255,.6),0 4px 10px rgba(0,0,0,.2)}
.pk::before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,255,255,.45),transparent 55%);opacity:.6}
.hero .pk{width:96px;height:96px;font-size:46px;border-radius:28px}
.eyebrow{font-size:12px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:rgba(255,255,255,.85)}
.hero h3{font-size:34px;font-weight:800;letter-spacing:-.5px}
.hero p{color:rgba(255,255,255,.88);margin:4px 0 14px;max-width:440px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.card{display:flex;align-items:center;gap:14px;padding:14px;border-radius:18px;background:rgba(0,0,0,.18)}
.card .m{flex:1;min-width:0}
.card b{display:block}
.card small{display:block;color:rgba(255,255,255,.7);font-size:13px}
.card code{display:block;color:rgba(255,255,255,.45);font-size:12px;font-family:var(--mono);margin-top:2px}
.pill{height:32px;padding:0 18px;border-radius:16px;font-weight:700;font-size:13px;background:var(--accent);color:#fff;display:grid;place-items:center;position:relative;overflow:hidden;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.45),0 4px 12px rgba(90,200,250,.4);flex-shrink:0;min-width:84px}
.pill.ghost{background:rgba(255,255,255,.16);box-shadow:inset 0 1px 0 rgba(255,255,255,.25)}
.pill i{position:absolute;left:0;top:0;bottom:0;background:rgba(90,200,250,.6)}
.pill span{position:relative}

/* terminal */
.term{flex:1;padding:8px 24px 20px;font-family:var(--mono);font-size:17px;line-height:1.62;background:rgba(0,0,0,.24);white-space:pre;overflow:hidden}
.c-acc{color:var(--accent);font-weight:600}.c-2{color:#c792ea}.c-dim{color:rgba(255,255,255,.45)}.c-ok{color:#3ee08f;font-weight:600}.c-b{font-weight:700}
.caret{display:inline-block;width:10px;height:20px;background:var(--accent);vertical-align:-3px;margin-left:2px}

/* launcher */
#lx{left:640px;top:250px;width:860px;border-radius:28px;overflow:hidden}
.lx-in{display:flex;align-items:center;gap:14px;padding:20px 24px;font-size:24px;font-weight:500}
.lx-res{border-top:1px solid rgba(255,255,255,.12);padding:10px}
.lx-sec{font-size:12px;font-weight:700;color:rgba(255,255,255,.5);text-transform:uppercase;letter-spacing:.07em;padding:8px 12px 4px}
.lx-it{display:flex;align-items:center;gap:14px;padding:10px 12px;border-radius:16px}
.lx-it.sel{background:rgba(255,255,255,.14)}
.lx-it .ii{width:40px;height:40px}
.lx-it .n{flex:1}.lx-it b{display:block;font-weight:600}.lx-it small{color:rgba(255,255,255,.5)}
.kbd{font-size:12px;color:rgba(255,255,255,.55);padding:4px 8px;border-radius:8px;background:rgba(0,0,0,.2)}

/* control center */
#cc{left:1494px;top:72px;width:400px;border-radius:28px;padding:16px;display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{border-radius:20px;padding:14px;background:rgba(0,0,0,.18);display:flex;align-items:center;gap:12px}
.tile .ic{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.14)}
.tile.on .ic{background:var(--accent);box-shadow:0 0 18px rgba(90,200,250,.6)}
.tile b{display:block;font-size:14px}.tile small{color:rgba(255,255,255,.5);font-size:12px}
.wide{grid-column:1/-1}
.srow{border-radius:20px;padding:14px 16px;background:rgba(0,0,0,.18)}
.srow label{font-weight:600;font-size:13px;display:block;margin-bottom:10px}
.track{height:26px;border-radius:13px;background:rgba(255,255,255,.15);position:relative;overflow:hidden;box-shadow:inset 0 1px 2px rgba(0,0,0,.2)}
.track i{position:absolute;left:0;top:0;bottom:0;border-radius:13px;background:rgba(255,255,255,.88)}

/* toast */
#toast{left:1508px;top:76px;width:390px;border-radius:22px;padding:14px 16px;display:flex;gap:14px;align-items:center}
#toast b{display:block}#toast small{color:rgba(255,255,255,.72)}

/* cursor */
#cursor{left:0;top:0;width:34px;height:34px;z-index:50;filter:drop-shadow(0 3px 6px rgba(0,0,0,.45))}
#ripple{left:0;top:0;width:60px;height:60px;margin:-30px 0 0 -30px;border-radius:50%;border:2px solid rgba(255,255,255,.8);z-index:49}

/* finale */
#badge{left:0;width:1920px;top:770px;display:flex;justify-content:center}
#badge div{padding:10px 20px;border-radius:20px;font-weight:700;font-size:15px;letter-spacing:.08em;text-transform:uppercase;position:relative}
#fine{left:0;width:1920px;bottom:40px;text-align:center;font-size:14px;color:rgba(255,255,255,.45)}
#black{position:absolute;inset:0;background:#000;z-index:100;pointer-events:none}

/* player chrome (hidden when rendering) */
#ctl{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);display:flex;align-items:center;gap:12px;padding:8px 14px;border-radius:16px;
  background:rgba(20,24,40,.7);backdrop-filter:blur(14px);color:#fff;font:13px Inter,system-ui,sans-serif;z-index:1000;transition:opacity .3s}
#ctl button{background:rgba(255,255,255,.15);border:0;color:#fff;width:34px;height:34px;border-radius:10px;font-size:14px;cursor:pointer}
#ctl input{width:min(520px,50vw)}
#ctl span{font-variant-numeric:tabular-nums;min-width:86px}
body.idle #ctl{opacity:0}
body.render #ctl{display:none}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <filter id="lg" x="0%" y="0%" width="100%" height="100%" color-interpolation-filters="sRGB">
    <feTurbulence type="fractalNoise" baseFrequency="0.006 0.014" numOctaves="2" seed="11" result="noise"/>
    <feGaussianBlur in="noise" stdDeviation="3" result="soft"/>
    <feDisplacementMap in="SourceGraphic" in2="soft" scale="52" xChannelSelector="R" yChannelSelector="G"/>
  </filter>
</svg>

<div id="stage">
  <div id="wall">
    <div class="blob" id="b1" style="width:1150px;height:1150px;background:radial-gradient(circle,#3a7bff,transparent 65%)"></div>
    <div class="blob" id="b2" style="width:960px;height:960px;background:radial-gradient(circle,#ff4fa0,transparent 65%)"></div>
    <div class="blob" id="b3" style="width:1060px;height:1060px;background:radial-gradient(circle,#1fe0c0,transparent 65%)"></div>
    <div class="blob" id="b4" style="width:580px;height:580px;background:radial-gradient(circle,#ffb347,transparent 65%)"></div>
    <svg id="ribbons" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice">
      <defs>
        <linearGradient id="rg1" x1="0" x2="1"><stop offset="0" stop-color="#3a7bff"/><stop offset="1" stop-color="#ff4fa0"/></linearGradient>
        <linearGradient id="rg2" x1="0" x2="1"><stop offset="0" stop-color="#1fe0c0"/><stop offset="1" stop-color="#ffb347"/></linearGradient>
      </defs>
      <g id="rib">
        <path d="M-100 720 C 300 520, 600 980, 1000 700 S 1500 420, 1750 600" fill="none" stroke="url(#rg1)" stroke-width="70" stroke-linecap="round" opacity=".7"/>
        <path d="M-100 820 C 360 640, 640 1040, 1060 800 S 1520 560, 1750 720" fill="none" stroke="url(#rg2)" stroke-width="26" stroke-linecap="round" opacity=".6"/>
        <path d="M-80 260 C 260 120, 520 420, 880 260 S 1380 60, 1700 200" fill="none" stroke="url(#rg2)" stroke-width="14" stroke-linecap="round" opacity=".45"/>
        <circle cx="1240" cy="330" r="190" fill="none" stroke="url(#rg1)" stroke-width="6" opacity=".5"/>
        <circle cx="300" cy="420" r="90" fill="none" stroke="url(#rg2)" stroke-width="4" opacity=".4"/>
      </g>
    </svg>
  </div>

  <!-- scene 2: lens -->
  <div class="glass lens abs" id="lens"></div>
  <div class="glass lens abs" id="pill"></div>

  <!-- shell chrome -->
  <div class="glass lens abs" id="topbar"></div>
  <div class="glass lens abs" id="dock"><div id="dockrow"></div></div>

  <!-- windows -->
  <div class="glass strong win abs" id="store" style="left:660px;top:116px;width:1200px;height:790px"></div>
  <div class="glass strong win abs" id="term" style="left:690px;top:128px;width:1150px;height:770px"></div>
  <div class="glass strong abs" id="lx"></div>
  <div class="glass strong abs" id="cc"></div>
  <div class="glass strong abs" id="toast"></div>

  <!-- type -->
  <div class="glass lens abs" id="logo"><svg viewBox="0 0 24 24"><path id="peak1" d="M2.5 19L9 7.5l3.2 5L15 8.5 21.5 19z"/><path id="peak2" d="M7.2 10.7l1.8 1.3 1.4-1.6"/></svg></div>
  <div class="abs" id="title"></div>
  <div class="abs" id="tagline">Linux, made of glass.</div>
  <div class="abs" id="badge"><div class="glass">In development</div></div>
  <div class="abs" id="fine">Interface shown is a design animation of Glacier OS, which is in active development.</div>
  <div id="caps"></div>

  <svg class="abs" id="cursor" viewBox="0 0 24 24"><path d="M4 2.5l15.5 9.2-6.8 1.6-3.6 6.2z" fill="#fff" stroke="#111a33" stroke-width="1.3" stroke-linejoin="round"/></svg>
  <div class="abs" id="ripple"></div>
  <div id="vignette"></div>
  <div id="black"></div>
</div>

<div id="ctl"><button id="pp" title="Play/Pause (Space)">❚❚</button><input id="scrub" type="range" min="0" max="50" step="0.01" value="0"><span id="tc">0.0 / 50.0</span><button id="mute" title="Sound">♪</button></div>
<audio id="music" src="glacier-trailer-music.m4a" preload="auto"></audio>

<script>
"use strict";
const DUR=50;
const $=s=>document.querySelector(s);
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const P=(t,a,b)=>clamp((t-a)/(b-a));
const lerp=(a,b,x)=>a+(b-a)*x;
const E={
  out:x=>1-Math.pow(1-x,3),
  inOut:x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2,
  back:x=>{const c1=1.5,c3=c1+1;return 1+c3*Math.pow(x-1,3)+c1*Math.pow(x-1,2)},
  spring:x=>x>=1?1:1-Math.exp(-6.5*x)*Math.cos(11*x),
};
/** visibility envelope: fade in over [a,a+d], out over [b,b+d] */
const env=(t,a,b,d=.6)=>E.out(P(t,a,a+d))*(1-E.inOut(P(t,b,b+d)));
function put(el,{x=0,y=0,s=1,o=1,r=0}={}){
  el.style.transform=`translate(${x}px,${y}px) scale(${s}) rotate(${r}deg)`;
  el.style.opacity=o;
  el.style.visibility=o<=0.002?'hidden':'visible';
}

/* ---------- icons ---------- */
const I={
  files:'<path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>',
  web:'<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 2.6 3.8 5.6 3.8 9s-1.3 6.4-3.8 9c-2.5-2.6-3.8-5.6-3.8-9S9.5 5.6 12 3z"/>',
  shell:'<rect x="3" y="4" width="18" height="16" rx="3"/><path d="M7 9l3 3-3 3M12 15h5"/>',
  store:'<path d="M4 7.5l8-4 8 4v9l-8 4-8-4z"/><path d="M4 7.5l8 4 8-4M12 11.5v9"/>',
  settings:'<path d="M4 6h9M17 6h3M4 12h3M11 12h9M4 18h11M19 18h1"/><circle cx="15" cy="6" r="2"/><circle cx="9" cy="12" r="2"/><circle cx="17" cy="18" r="2"/>',
  music:'<path d="M9 18V5l11-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="17" cy="16" r="3"/>',
  trash:'<path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/>',
  grid:'<rect x="4" y="4" width="6.5" height="6.5" rx="2"/><rect x="13.5" y="4" width="6.5" height="6.5" rx="2"/><rect x="4" y="13.5" width="6.5" height="6.5" rx="2"/><rect x="13.5" y="13.5" width="6.5" height="6.5" rx="2"/>',
  peak:'<path d="M2.5 19L9 7.5l3.2 5L15 8.5 21.5 19z"/><path d="M7.2 10.7l1.8 1.3 1.4-1.6"/>',
  wifi:'<path d="M2 9a15 15 0 0 1 20 0M5 12.5a10 10 0 0 1 14 0M8.5 16a5 5 0 0 1 7 0"/><circle cx="12" cy="19.5" r="1" fill="currentColor"/>',
  battery:'<rect x="2" y="7" width="18" height="10" rx="3"/><path d="M22 11v2"/><rect x="4.5" y="9.5" width="11" height="5" rx="1.2" fill="currentColor" stroke="none"/>',
  volume:'<path d="M4 10v4h4l5 4V6L8 10z"/><path d="M16 9a4 4 0 0 1 0 6M18.5 6.5a8 8 0 0 1 0 11"/>',
  search:'<circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/>',

  const tIn=E.spring(P(t,25.35,26.3)), tOut=E.inOut(P(t,35.2,35.8));
  const tx=itemX[SHELL_IDX]-(690+575), ty=DOCK_Y-(128+385);
  put($('#term'),{x:lerp(tx,0,tIn),y:lerp(ty,0,tIn)+tOut*40,s:lerp(.12,1,tIn)*(1-.08*tOut),o:clamp(P(t,25.35,25.6))*(1-tOut)});
  if(t>25.3&&t<36) $('#tx').innerHTML=termHTML(t);

  /* launcher */
  const lIn=E.back(P(t,35.8,36.4)), lOut=E.inOut(P(t,38.5,38.9));
  put($('#lx'),{s:lerp(.92,1,lIn)*(1-.04*lOut),y:(1-lIn)*-20,o:clamp(P(t,35.8,36.1))*(1-lOut)});
  if(t>35.7&&t<39) lxHTML(t);

  /* control center */
  const cIn=E.back(P(t,39.6,40.1)), cOut=E.inOut(P(t,42.2,42.7));
  put($('#cc'),{s:lerp(.9,1,cIn)*(1-.05*cOut),y:(1-cIn)*-14,o:clamp(P(t,39.6,39.85))*(1-cOut)});
  $('#cc').style.transformOrigin='100% 0';
  const fOn=t>=40.42;$('#t-focus').classList.toggle('on',fOn);$('#focus-sub').textContent=fOn?'On':'Off';
  $('#vol').style.width=lerp(45,82,E.inOut(P(t,40.9,41.6)))+'%';

  /* captions */
  CAPS.forEach((c,i)=>{const o=env(t,c[0],c[1],.6);const el=capEls[i];el.style.opacity=o;el.style.visibility=o<=.002?'hidden':'visible';
    el.style.transform=`translateY(${(1-E.out(P(t,c[0],c[0]+.8)))*30}px)`;el.style.filter=o<1?`blur(${(1-o)*8}px)`:'none'});

  /* cursor + click ripple */
  const cv=(t>13.4&&t<26.2)||(t>38.4&&t<42.6);
  const co=Math.min(env(t,13.4,25.9,.3)+env(t,38.4,42.3,.3),1);
  let press=0;CLICKS.forEach(c=>{press=Math.max(press,1-Math.abs(t-c)/.12)});
  put($('#cursor'),{x:cur.x-4,y:cur.y-3,s:1-.15*clamp(press),o:cv?co:0});
  let rp=-1,rc=0;CLICKS.forEach(c=>{if(t>=c&&t<c+.55){rp=P(t,c,c+.55);rc=c}});
  put($('#ripple'),{x:cur.x,y:cur.y,s:rp<0?0:lerp(.3,1.4,E.out(rp)),o:rp<0?0:(1-rp)*.9});
}

/* ---------- player ---------- */
let T=0, playing=true, last=performance.now();
const isRender=new URLSearchParams(location.search).has('render');
if(isRender) document.body.classList.add('render');
function fit(){const s=isRender?1:Math.min(innerWidth/1920,innerHeight/1080);$('#stage').style.transform=`translate(-50%,-50%) scale(${s})`}
addEventListener('resize',fit);
const music=$('#music');let muted=false;
function setUI(){$('#scrub').value=T;$('#tc').textContent=T.toFixed(1)+' / '+DUR.toFixed(1);$('#pp').textContent=playing?'❚❚':'▶'}
function syncAudio(){
  if(isRender||!music) return;
  if(playing&&!muted){ if(Math.abs(music.currentTime-T)>.25) music.currentTime=T; if(music.paused) music.play().catch(()=>{}) }
  else if(!music.paused) music.pause();
}
function loop(now){
  if(playing){T+=(now-last)/1000; if(T>=DUR){T=DUR;playing=false}}
  last=now; render(T); setUI(); syncAudio();
  requestAnimationFrame(loop);
}
window.seek=t=>{T=t;render(t)};
function init(){
  fit(); measureDock(); CUR=[[0,0,0]]; measureTargets(); buildCursor(); render(0);
  if(!isRender) requestAnimationFrame(n=>{last=n;loop(n)});
  window.__ready=true;
}
$('#pp').onclick=()=>{if(T>=DUR)T=0;playing=!playing;last=performance.now()};
$('#scrub').oninput=e=>{T=+e.target.value;render(T)};
$('#mute').onclick=()=>{muted=!muted;$('#mute').style.opacity=muted?.4:1};
addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();$('#pp').click()} if(e.key==='ArrowRight')T=Math.min(DUR,T+2); if(e.key==='ArrowLeft')T=Math.max(0,T-2)});
let idle;addEventListener('mousemove',()=>{document.body.classList.remove('idle');clearTimeout(idle);idle=setTimeout(()=>document.body.classList.add('idle'),2200)});
(document.fonts?document.fonts.ready:Promise.resolve()).then(init);
</script>
