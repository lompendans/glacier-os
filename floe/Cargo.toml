[package]
name = "floe"
version = "0.1.0"
edition = "2021"
description = "Glacier OS package manager: pacman with generations and rollback"
license = "MIT"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.release]
lto = true
strip = true
